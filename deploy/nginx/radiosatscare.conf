# Nginx reverse proxy for radiosatscare.com
#
#   browser --HTTPS--> Nginx --> Next.js app (127.0.0.1:3400): website + /api
#
# Install:  sudo cp deploy/nginx/rsc-proxy.conf /etc/nginx/rsc-proxy.conf
#           sudo cp deploy/nginx/radiosatscare.conf /etc/nginx/sites-available/radiosatscare.conf
#           sudo ln -s /etc/nginx/sites-available/radiosatscare.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Certificates (first time, with only the port-80 block enabled):
#           sudo certbot certonly --webroot -w /var/www/certbot -d radiosatscare.com -d www.radiosatscare.com

# --- Rate limiting zones (http context: this file is included inside http {}) ---
limit_req_zone $binary_remote_addr zone=rsc_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=rsc_conn:10m;

upstream rsc_app {
    server 127.0.0.1:3400;
    keepalive 16;
}

# --- HTTP: redirect everything to HTTPS (and serve ACME challenges) ---
server {
    listen 80;
    listen [::]:80;
    server_name radiosatscare.com www.radiosatscare.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://radiosatscare.com$request_uri;
    }
}

# --- HTTPS: www -> apex ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.radiosatscare.com;

    ssl_certificate     /etc/letsencrypt/live/radiosatscare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radiosatscare.com/privkey.pem;

    return 301 https://radiosatscare.com$request_uri;
}

# --- HTTPS: the site ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name radiosatscare.com;

    ssl_certificate     /etc/letsencrypt/live/radiosatscare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radiosatscare.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 64k;        # enquiries are tiny; the API enforces its own 20kb JSON limit
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn rsc_conn 30;

    # HSTS (only after you have confirmed HTTPS works for the apex and www).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # --- API: an extra rate limit in front of the app's own limits ---
    location /api/ {
        limit_req zone=rsc_api burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/rsc-proxy.conf;
    }

    # --- Immutable build assets ---
    location /_next/static/ {
        include /etc/nginx/rsc-proxy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # --- Everything else: the pages ---
    location / {
        include /etc/nginx/rsc-proxy.conf;
    }
}
