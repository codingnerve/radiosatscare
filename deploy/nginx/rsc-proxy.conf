# Shared proxy settings for the Next.js app. Install alongside the site config:
#   sudo cp deploy/nginx/rsc-proxy.conf /etc/nginx/rsc-proxy.conf
proxy_pass http://rsc_app;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# The app trusts exactly one proxy hop (TRUST_PROXY=1) and reads the visitor's IP from this header.
# Overwrite it with the real address, never append to a value the visitor sent.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
